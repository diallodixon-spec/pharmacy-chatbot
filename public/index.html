<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SuperMed Pharmacy — Product Assistant (test)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.25rem; }
  #log { border: 1px solid #ddd; border-radius: 8px; padding: 16px; height: 420px; overflow-y: auto; margin-bottom: 12px; background: #fafafa; }
  .msg { margin-bottom: 12px; line-height: 1.4; }
  .user { text-align: right; }
  .user .bubble { background: #0a7a4b; color: #fff; }
  .bot .bubble { background: #fff; border: 1px solid #ddd; }
  .bubble { display: inline-block; padding: 8px 12px; border-radius: 12px; max-width: 80%; white-space: pre-wrap; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 16px; border: none; border-radius: 6px; background: #0a7a4b; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>SuperMed Pharmacy — Product Assistant (test page)</h1>
  <p>Ask things like "do you have vitamins for kids" or "what pain relief tablets do you carry".</p>
  <div id="log"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="Ask about a product..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    // Point this at your deployed Vercel function URL.
    const API_URL = "/api/chat";

    const log = document.getElementById("log");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const history = [];

    function addMessage(role, text) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + (role === "user" ? "user" : "bot");
      const bubble = document.createElement("span");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage("user", message);
      input.value = "";
      input.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await res.json();
        const reply = data.reply || data.error || "Something went wrong.";
        addMessage("bot", reply);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        addMessage("bot", "Error reaching the assistant. Please try again.");
      } finally {
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
